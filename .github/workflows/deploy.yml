name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ATLAS_SITE: https://nighantu.ageayurveda.com
  ATLAS_BASE: /

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # content/ is committed, so the build never needs the private source vault.

      # The date ledger must be committed and current. If it is stale the build
      # would fall back to older dates, so fail loudly rather than publish silently
      # wrong dateModified values.
      - name: Date ledger is current
        run: node scripts/stamp-dates.mjs --check

      # public/research.{json,csv} are generated, not committed, so they must exist
      # before astro copies public/ into dist/.
      - name: Generate the research downloads
        run: node scripts/research-index.mjs
      # Same reason: generated, not committed, and must exist before the build.
      - name: Generate the Dravyaguna dataset
        run: node scripts/dravyaguna.mjs
      - name: Generate the verification ledger
        run: node scripts/verification.mjs
      # The formulary compositions were rendering on 101 formulation pages and published as a
      # dataset nowhere. Generated, not committed, so this must run before the build.
      - name: Generate the formulary composition dataset
        run: node scripts/composition-dataset.mjs
      # src/data/lexicon.json is committed, exported from the local-only lexicon repository by its
      # own script, so this step only reshapes what is already here. It is also the step that
      # applies the licence split: renderings from the WHO terminologies and the Government of
      # India lists appear on the pages and not in the CC BY 4.0 downloads. See LICENSES.md.
      - name: Generate the terminology lexicon dataset
        run: node scripts/lexicon-dataset.mjs
      # src/data/concepts.json is likewise committed, exported from the same local-only repository.
      # This step reshapes it and runs two refusals before writing: no quotation of a modern paper
      # past sixty words, and no citation carrying both a withholding notice and the text it
      # withholds. Generated, not committed, so it must run before the build.
      - name: Generate the concept dataset
        run: node scripts/concepts-dataset.mjs
      - name: Generate the constituent graph
        run: node scripts/compounds.mjs
      - name: Generate the reading-links dataset
        run: node scripts/enrich-access.mjs
      # Reads the committed cache in data/enrichment/, so this makes no network
      # requests in CI and cannot fail on a provider outage.
      - name: Generate the taxonomy dataset
        run: node scripts/enrich-taxonomy.mjs
      # Order matters: the constituent graph is built, enriched, then rebuilt, because
      # the second pass merges nodes that PubChem says are the same structure. Both
      # enrichment steps read the committed cache and make no network requests here.
      - name: Resolve constituent chemistry
        run: node scripts/enrich-compounds.mjs
      - name: Rebuild the constituent graph with merged structures
        run: node scripts/compounds.mjs
      # The safety schema is the gate on the highest-consequence content on the site,
      # so its negative tests run in CI rather than only on a developer's machine.
      - name: Safety schema tests
        run: node scripts/test/safety.test.mjs
      - name: Identifier grammar tests
        run: node scripts/test/identifiers.test.mjs
      # The only code here that decides whether to fetch a page belonging to someone else. Its
      # negative cases are the shapes where a careless parser answers yes to a file that said no.
      - name: robots.txt parser tests
        run: node scripts/test/robots.test.mjs
      # Decides which formulation a manufacturer's product name refers to. A miss loses a product
      # from a comparison; a false match puts one formulation's composition beside another's
      # label, which is the failure that matters, so most of the cases are negative.
      - name: Formulation name matcher tests
        run: node scripts/test/formulation-names.test.mjs
      # Reads what a manufacturer's page states. The finding it feeds is mostly about ABSENCE,
      # so the cases that matter are the ones separating "this page publishes no composition"
      # from "this code could not read the page", and keeping a pack size off the ingredient list.
      - name: Product extraction tests
        run: node scripts/test/product-extract.test.mjs
      # Deterministic anti-hallucination checks for generated prose. Models auditing
      # models has already failed on this project once; these do not have a bad day.
      - name: Grounding checks
        run: node scripts/test/grounding.test.mjs

      # The audit gates the build: a compliance violation fails the deploy.
      - name: Compliance audit (pre-build)
        run: node scripts/audit.mjs

      - name: Build
        run: npx astro build

      - name: Compliance audit (post-build, product modules)
        run: node scripts/audit.mjs

      - name: Internal link check
        run: node scripts/linkcheck.mjs
      # AI crawlers do not execute JavaScript and waste roughly a third of their
      # fetches on 404s, so an unreachable or JS-rendered page costs far more here
      # than conventional SEO guidance implies.
      - name: Crawlability and indexability
        run: node scripts/crawl-audit.mjs

      # The dose figure is the most consequential claim on a formulation page and was, until
      # 8 October, the least sourced: of 51 formulations where the Ayurvedic Formulary of India's
      # own dose is held, three page figures matched it and none named a source. These two gates
      # keep that from drifting back, and they are here rather than only on a developer's machine
      # because a gate outside the pipeline is documentation.
      - name: Dose provenance
        run: node scripts/dose-provenance.mjs
      # Catches a page showing an AFI entry for a DIFFERENT formulation than its own name, which
      # mahasudarshan-churna was doing: the formulary carries Sudarsana Curna and no maha- entry.
      - name: Formulary entry naming
        run: node scripts/check-afi-naming.mjs
      # The blunt question the other gates do not ask: is any page on this site broken. It found
      # 53 reference pages stamping build time into dateModified because the ledger lookup used
      # the record's `kind` where the ledger is keyed by directory, and two lexicon pages sharing
      # a title. Both passed all six existing gates.
      - name: Site sweep
        run: node scripts/site-audit.mjs

      # composition.parquet is committed rather than built here, because converting it needs
      # Python and pyarrow. That trade is only defensible with a freshness check: a committed
      # derived file with no test is one that eventually states what the source no longer says.
      - name: Parquet distributions are present and current
        run: node scripts/check-parquet.mjs

      # Last thing before the artifact is uploaded, and it has to be last: it reads the built
      # research pages to find which bucket each paper is displayed in, so dist must exist, and
      # it writes into dist rather than public/ because public/chemistry.json is committed and
      # canary tokens have no business in version control.
      #
      # The datasets are CC BY 4.0, so attribution is already required; what was missing was
      # evidence. Every record gets the URL of the page it is displayed on, which survives the
      # partial copies that are the normal kind. The canary token, which is the layer that
      # actually proves origin, is written only when the secret is set and is skipped silently
      # otherwise, because a token keyed to nothing would be decoration.
      - name: Stamp datasets with attribution and canaries
        run: node scripts/stamp-datasets.mjs --write
        env:
          ATLAS_CANARY_SECRET: ${{ secrets.ATLAS_CANARY_SECRET }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing, Yandex, Naver and Seznam what CHANGED. No account needed, and a failed
  # ping never fails the deploy.
  #
  # Change detection is the contract, not an optimisation: IndexNow deprioritises and
  # eventually 429s hosts that resubmit unchanged URLs. scripts/indexnow.mjs hashes the
  # built pages against data/monitor-state.json and submits only genuine changes, then
  # commits the updated baseline.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    concurrency:
      group: monitors
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Rebuilt rather than downloaded: the Pages artifact is a tarball for the
      # deploy action, and indexnow.mjs needs dist/ on disk to hash pages.
      - run: npx astro build
      - run: node scripts/indexnow.mjs

      - name: Commit the submission baseline
        run: |
          git config user.name  "nighantu-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor-state.json
          git commit -m "IndexNow baseline after deploy" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
