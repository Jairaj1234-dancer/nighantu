name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ATLAS_SITE: https://jairaj1234-dancer.github.io
  ATLAS_BASE: /nighantu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # content/ is committed, so the build never needs the private source vault.
      # The audit gates the build: a compliance violation fails the deploy.
      - name: Compliance audit (pre-build)
        run: node scripts/audit.mjs

      - name: Build
        run: npx astro build

      - name: Compliance audit (post-build, product modules)
        run: node scripts/audit.mjs

      - name: Internal link check
        run: node scripts/linkcheck.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
