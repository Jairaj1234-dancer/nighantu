name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ATLAS_SITE: https://jairaj1234-dancer.github.io
  ATLAS_BASE: /nighantu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # content/ is committed, so the build never needs the private source vault.

      # The date ledger must be committed and current. If it is stale the build
      # would fall back to older dates, so fail loudly rather than publish silently
      # wrong dateModified values.
      - name: Date ledger is current
        run: node scripts/stamp-dates.mjs --check

      # public/research.{json,csv} are generated, not committed, so they must exist
      # before astro copies public/ into dist/.
      - name: Generate the research downloads
        run: node scripts/research-index.mjs
      # Same reason: generated, not committed, and must exist before the build.
      - name: Generate the Dravyaguna dataset
        run: node scripts/dravyaguna.mjs
      - name: Generate the verification ledger
        run: node scripts/verification.mjs
      - name: Generate the constituent graph
        run: node scripts/compounds.mjs
      # Reads the committed cache in data/enrichment/, so this makes no network
      # requests in CI and cannot fail on a provider outage.
      - name: Generate the taxonomy dataset
        run: node scripts/enrich-taxonomy.mjs
      # Order matters: the constituent graph is built, enriched, then rebuilt, because
      # the second pass merges nodes that PubChem says are the same structure. Both
      # enrichment steps read the committed cache and make no network requests here.
      - name: Resolve constituent chemistry
        run: node scripts/enrich-compounds.mjs
      - name: Rebuild the constituent graph with merged structures
        run: node scripts/compounds.mjs
      # The safety schema is the gate on the highest-consequence content on the site,
      # so its negative tests run in CI rather than only on a developer's machine.
      - name: Safety schema tests
        run: node scripts/test/safety.test.mjs
      - name: Identifier grammar tests
        run: node scripts/test/identifiers.test.mjs

      # The audit gates the build: a compliance violation fails the deploy.
      - name: Compliance audit (pre-build)
        run: node scripts/audit.mjs

      - name: Build
        run: npx astro build

      - name: Compliance audit (post-build, product modules)
        run: node scripts/audit.mjs

      - name: Internal link check
        run: node scripts/linkcheck.mjs
      # AI crawlers do not execute JavaScript and waste roughly a third of their
      # fetches on 404s, so an unreachable or JS-rendered page costs far more here
      # than conventional SEO guidance implies.
      - name: Crawlability and indexability
        run: node scripts/crawl-audit.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing, Yandex, Naver and Seznam what CHANGED. No account needed, and a failed
  # ping never fails the deploy.
  #
  # Change detection is the contract, not an optimisation: IndexNow deprioritises and
  # eventually 429s hosts that resubmit unchanged URLs. scripts/indexnow.mjs hashes the
  # built pages against data/monitor-state.json and submits only genuine changes, then
  # commits the updated baseline.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    concurrency:
      group: monitors
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Rebuilt rather than downloaded: the Pages artifact is a tarball for the
      # deploy action, and indexnow.mjs needs dist/ on disk to hash pages.
      - run: npx astro build
      - run: node scripts/indexnow.mjs

      - name: Commit the submission baseline
        run: |
          git config user.name  "nighantu-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor-state.json
          git commit -m "IndexNow baseline after deploy" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
