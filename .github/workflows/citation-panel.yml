name: Citation panel

# Monthly: run the panel against an answer engine with web search and record whether Age
# Ayurveda or the Nighantu was cited. There is no analytics product that reports "you were
# cited", so this is the only way to measure the thing this site exists to do.
#
# Gemini by default, because its free tier covers this: 54 grounded requests a month against
# an allowance of 5,000, and Google Search grounding is the closest available proxy for
# Google AI Overviews. ANTHROPIC_API_KEY still works if set and no Gemini key is present.
#
# Monthly is the right cadence, not weekly. On a new domain, movement takes 8 to 12 weeks,
# so a single reading says nothing and the series is the measurement.
#
# Skips itself cleanly when no key is set, so the workflow can sit committed without one.

on:
  schedule:
    # 05:23 UTC on the 1st (10:53 IST). Off the hour and off midnight, which is the
    # single most congested slot on the Actions shared pool.
    - cron: '23 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitors
  cancel-in-progress: false

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for an API key
        id: key
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "provider=gemini" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "provider=anthropic" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No GEMINI_API_KEY or ANTHROPIC_API_KEY. Skipping the panel."
          fi

      - uses: actions/setup-node@v5
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.key.outputs.present == 'true'

      - name: Run the panel
        if: steps.key.outputs.present == 'true'
        env:
          # Passed as env vars, never interpolated into a shell string, so they cannot end
          # up in the run log.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEO_AUDIT_PROVIDER: ${{ steps.key.outputs.provider }}
          # The free tier limits requests per minute, and a grounded answer takes several
          # seconds. Unpaced, the run trips the limit two thirds of the way through and the
          # rest of the panel records quota errors instead of answers.
          GEO_AUDIT_PACE_MS: '9000'
        # 54 prompts at this pace take about ten minutes. The script now aborts as soon as
        # a DAILY allowance is refused rather than backing off through it, so a run that
        # cannot proceed ends in seconds instead of burning the timeout.
        timeout-minutes: 25
        run: node scripts/geo-audit.mjs

      # Runs even when the panel step failed, because a partial panel still holds real
      # answers worth keeping, and the script records no row for a prompt it never asked.
      - name: Report the change and commit
        if: always() && steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/citation-report.mjs --issue || true
          git config user.name  "nighantu-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/citation-log.csv data/DASHBOARD.md
          git commit -m "Citation panel $(date -u +%Y-%m)" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
