name: Refresh citations

# Monthly: re-query PubMed for new literature, rebuild the research index, and
# resubmit only the pages that actually changed.
#
# No account and no API key: NCBI allows 3 requests a second unauthenticated,
# provided the tool and email parameters are sent, which scripts/lib/pubmed.mjs does.

on:
  schedule:
    # 04:37 UTC on the 3rd. Off the hour and away from the 1st, which the citation
    # panel already uses, so the two never contend for the same runner slot.
    - cron: '37 4 3 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitors
  cancel-in-progress: false

env:
  ATLAS_SITE: https://nighantu.ageayurveda.com
  ATLAS_BASE: ''

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The companion database is a local-only source. In CI only the committed
      # citations and live PubMed are available, which is why citations.mjs merges
      # rather than regenerating from scratch.
      - name: Re-query PubMed
        run: node scripts/citations.mjs

      # Retraction is not a property a paper has when you cite it; it is one it can
      # acquire later, and nothing about our copy of the citation changes when it does.
      # So this has to run on the schedule, not once. 14 retracted papers were being
      # cited as evidence the first time anyone asked, across 2,906.
      #
      # This is deliberately ALSO run here, as well as weekly in retractions.yml. The step above
      # has just added newly published papers, and checking those straight away beats waiting up
      # to a week. Running the check twice is safe because the blocklist merges rather than
      # overwrites and the drop is idempotent. The weekly workflow exists because a safety check
      # should not be silenceable by an unrelated failure in a heavier job, which is exactly what
      # happened to this one: it failed at a later step every month and the check never completed.
      - name: Check every cited paper for retraction
        run: node scripts/check-retractions.mjs

      - name: Remove any newly retracted paper
        run: node scripts/drop-retracted.mjs

      # Every download the site advertises, not just the research index. This workflow used to
      # regenerate only the research index and then run linkcheck, which failed on six dataset
      # links it had never generated. The retraction check above was therefore scheduled from the
      # start and had never completed a single run.
      - name: Generate every download
        run: ./scripts/build-downloads.sh

      - name: Rebuild and gate
        run: |
          node scripts/stamp-dates.mjs
          node scripts/audit.mjs
          npx astro build
          node scripts/linkcheck.mjs
          node scripts/crawl-audit.mjs
          node scripts/brand-disclosure.mjs --check
          node scripts/dose-comparison.mjs --check
          node scripts/verse-numbering.mjs --check

      - name: Report what changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/citations-report.mjs --issue || true

      - name: Commit
        run: |
          git config user.name  "nighantu-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/citations.json src/data/research.json src/data/page-dates.json data/retractions.json
          git commit -m "Citation refresh $(date -u +%Y-%m)" || exit 0
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
